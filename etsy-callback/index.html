<!doctype html>
<html>
<head><meta charset="utf-8"><title>Etsy Callback</title></head>
<body style="font-family:sans-serif;max-width:700px;margin:40px auto;padding:0 16px">
  <h2>คัดลอก URL ด้านล่างไปวางในโปรแกรม</h2>
  <textarea id="u" rows="6" style="width:100%"></textarea>
  <button onclick="navigator.clipboard.writeText(u.value);this.innerText='คัดลอกแล้ว'">คัดลอก</button>
  <script>u.value = location.href;</script>
</body>
</html>
